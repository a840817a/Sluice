<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sluice — 播放器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: system-ui, -apple-system, sans-serif;
  color: #fff;
}

#wrap {
  position: relative;
  width: 100%; height: 100dvh;
  background: #000;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#video {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* ── Overlay ── */
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  transition: opacity .25s;
}
#overlay.hidden { opacity: 0; pointer-events: none; }

/* ── Top bar ── */
#top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .75rem 1rem;
  background: linear-gradient(to bottom, rgba(0,0,0,.72) 0%, transparent 100%);
  gap: .75rem;
}

#channel-title {
  font-size: .95rem;
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0,0,0,.9);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: .25; }
}

/* ── Unmute hint (after a muted autoplay) ── */
#unmute-hint {
  position: absolute;
  top: 3.25rem;
  left: 1rem;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: .45rem;
  background: rgba(255,255,255,.92);
  color: #111;
  border: none;
  border-radius: 8px;
  font-size: .85rem;
  font-weight: 600;
  padding: .45rem .8rem;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
#unmute-hint[hidden] { display: none; }
#unmute-hint svg { width: 18px; height: 18px; fill: currentColor; }

/* ── Center click zone ── */
#center {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Seek feedback toast */
#seek-toast {
  position: absolute;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 10px;
  padding: .45rem 1.1rem;
  font-size: 1rem;
  font-weight: 600;
  opacity: 0;
  transition: opacity .15s;
  pointer-events: none;
}
#seek-toast.show { opacity: 1; }
#seek-toast.icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#seek-toast.icon svg {
  width: 36px;
  height: 36px;
  fill: #fff;
}

#start-overlay {
  position: absolute;
  width: 86px;
  height: 86px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.48);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 10px 36px rgba(0,0,0,.45);
  opacity: 0;
  transform: scale(.96);
  transition: opacity .18s, transform .18s;
  pointer-events: none;
}
#start-overlay.show { opacity: 1; transform: scale(1); }
#start-overlay svg {
  width: 46px;
  height: 46px;
  fill: #fff;
}

/* ── Spinner ── */
#spinner {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}
#spinner.show { opacity: 1; }
#spinner svg { width: 48px; height: 48px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error overlay ── */
#error-box {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  background: rgba(0,0,0,.55);
  padding: 2rem;
  text-align: center;
  /* Above the controls, which have nothing to act on once loading failed. */
  z-index: 10;
}
#error-box.show { display: flex; }

/* ── Picture-in-picture placeholder ── */
#pip-placeholder {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: .9rem;
  pointer-events: none;
}
#wrap.pip #pip-placeholder { display: flex; }
/* Chrome draws its own PiP notice inside the element, under the title. */
#wrap.pip #video { opacity: 0; }
#pip-placeholder svg { width: 48px; height: 48px; fill: rgba(255,255,255,.55); }
#pip-msg { color: rgba(255,255,255,.75); font-size: .95rem; }
#btn-pip-return, #btn-retry {
  pointer-events: auto;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 8px;
  color: #fff;
  font-size: .85rem;
  padding: .45rem 1rem;
  cursor: pointer;
}
#btn-pip-return:hover, #btn-retry:hover { background: rgba(255,255,255,.2); }
#btn-retry[hidden] { display: none; }
#error-msg { color: #fca5a5; font-size: .9rem; max-width: 480px; }

/* ── Bottom bar ── */
#bottom-bar {
  padding: 0 .75rem .65rem;
  background: linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 100%);
}

/* Progress track */
#prog-wrap {
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}
#prog-track {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,.22);
  border-radius: 2px;
  position: relative;
  transition: height .12s;
}
#prog-wrap:hover #prog-track,
#prog-wrap.dragging #prog-track { height: 6px; }
#prog-buf {
  position: absolute; height: 100%;
  background: rgba(255,255,255,.32);
  border-radius: 2px;
}
#prog-fill {
  position: absolute; height: 100%;
  background: #dc2626;
  border-radius: 2px;
}
#prog-thumb {
  position: absolute;
  width: 13px; height: 13px;
  background: #fff;
  border-radius: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity .12s;
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
}
#prog-wrap:hover #prog-thumb,
#prog-wrap.dragging #prog-thumb { opacity: 1; }
#prog-tip {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 0;
  transform: translateX(-50%);
  background: rgba(0,0,0,.78);
  color: #fff;
  border-radius: 6px;
  padding: .28rem .48rem;
  font-size: .72rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .1s;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
#prog-tip.show { opacity: 1; }
#prog-tip::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: rgba(0,0,0,.78);
}

/* Controls row */
#ctrl-row {
  display: flex;
  align-items: center;
  gap: .1rem;
  margin-top: .05rem;
}

/* Icon button */
.ibtn {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 40px; min-height: 40px;
  padding: 0 6px;
  border-radius: 6px;
  flex-shrink: 0;
  transition: background .12s;
  -webkit-tap-highlight-color: transparent;
}
.ibtn:hover { background: rgba(255,255,255,.13); }
/* One icon size across the row. */
.ibtn svg { width: 24px; height: 24px; fill: currentColor; pointer-events: none; }
/* Line icons: the fill above would fill their arcs in. */
.ibtn svg.line {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ibtn svg.line text { fill: currentColor; stroke: none; }


/* Time display */
#time-disp {
  font-size: .78rem;
  color: rgba(255,255,255,.82);
  white-space: nowrap;
  margin: 0 .2rem;
  font-variant-numeric: tabular-nums;
  /* The one item that shrinks on a narrow row, so a long behind-live time is
     cut rather than pushing the buttons out. */
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.spacer { flex: 1; }

/* The one live indicator: a red dot at the live edge, grey once behind it,
   when a click brings the viewer back. */
#btn-live { gap: .35rem; padding: 0 .5rem; }
#btn-live .ldot {
  width: 6px; height: 6px;
  background: #dc2626;
  border-radius: 50%;
  animation: blink 1.4s ease-in-out infinite;
}
#btn-live .live-label {
  font-size: .72rem; font-weight: 700; letter-spacing: .06em;
}
#btn-live.behind .ldot { background: rgba(255,255,255,.55); animation: none; }
#btn-live.behind .live-label { color: rgba(255,255,255,.7); }
#btn-live:not(.behind) { cursor: default; }
#btn-live:not(.behind):hover { background: none; }

/* Volume */
#vol-wrap { display: flex; align-items: center; gap: .1rem; position: relative; }
#vol-slider {
  width: 64px;
  accent-color: #fff;
  cursor: pointer;
  height: 4px;
}
@media (max-width: 500px) {
  #vol-slider {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) rotate(-90deg);
    transform-origin: center;
    width: 96px;
    background: rgba(12,12,12,.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: .55rem .35rem;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
  }
  #vol-wrap.popup #vol-slider { display: block; }
}

/* Quality */
#qual-wrap { position: relative; }
#qual-btn { position: relative; }
#qual-btn[aria-expanded="true"] { background: rgba(255,255,255,.13); }
/* The playing height on the gear: grey under ABR, white once pinned. */
#qual-badge {
  position: absolute;
  top: 4px;
  right: 0;
  padding: 1px 3px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  line-height: 1.2;
  background: #3f3f46;
  color: #f4f4f5;
  pointer-events: none;
}
#qual-badge:empty { display: none; }
#qual-btn.pinned #qual-badge { background: #fff; color: #111; }
#qual-menu {
  position: absolute;
  bottom: calc(100% + 8px);
  right: 0;
  background: rgba(12,12,12,.96);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  min-width: 120px;
  padding: .3rem 0;
  display: none;
  flex-direction: column;
  z-index: 20;
  box-shadow: 0 6px 24px rgba(0,0,0,.55);
}
#qual-menu.open { display: flex; }
.qi {
  width: 100%;
  background: none;
  border: none;
  padding: .5rem .9rem;
  font-size: .82rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  color: rgba(255,255,255,.8);
  transition: background .1s;
  text-align: left;
}
.qi:hover,
.qi:focus-visible { background: rgba(255,255,255,.1); color: #fff; outline: none; }
.qi.active { color: #fff; font-weight: 700; }
.qi .ck { opacity: 0; font-size: .8rem; }
.qi.active .ck { opacity: 1; }

/* Mobile: bigger touch areas */
@media (max-width: 600px) {
  .ibtn { min-width: 44px; min-height: 44px; }
  #channel-title { font-size: .85rem; }
  #qual-badge { top: 6px; right: 1px; }
}
/* A phone has no room for ±10 s; double-tapping either side seeks instead. */
@media (max-width: 500px) {
  #btn-back, #btn-fwd { display: none; }
}
/* The smallest phones drop the PiP button too; the browser can still enter
   PiP on a tab switch. */
@media (max-width: 359px) {
  #btn-pip { display: none !important; }
}
</style>
<script src="/player-assets/vendor/shaka-player.5.2.12.compiled.js"></script>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline></video>

  <!-- Spinner (outside overlay — always visible) -->
  <div id="spinner">
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 2a10 10 0 1 0 10 10"/>
    </svg>
  </div>

  <!-- Error -->
  <div id="error-box">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="#fca5a5">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>
    <div id="error-msg"></div>
    <button id="btn-retry" hidden>重試</button>
  </div>

  <!-- Shown after a muted autoplay; stays when the controls hide -->
  <button id="unmute-hint" hidden>
    <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    點擊開啟聲音
  </button>

  <!-- Controls overlay -->
  <div id="overlay">

    <!-- Top bar -->
    <div id="top-bar">
      <span id="channel-title">載入中…</span>
    </div>

    <!-- Center: click / double-click zone -->
    <div id="center">
      <div id="start-overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div id="seek-toast"></div>
      <!-- Shown in place of the video while it plays in the picture-in-picture window -->
      <div id="pip-placeholder">
        <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
        <div id="pip-msg">正在以子母畫面播放</div>
        <button id="btn-pip-return">移回此頁</button>
      </div>
    </div>

    <!-- Bottom bar -->
    <div id="bottom-bar">

      <!-- Progress -->
      <div id="prog-wrap" role="slider" tabindex="0" aria-label="播放進度"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="prog-track">
          <div id="prog-buf"></div>
          <div id="prog-fill"></div>
          <div id="prog-thumb"></div>
          <div id="prog-tip"></div>
        </div>
      </div>

      <!-- Controls row -->
      <div id="ctrl-row">

        <!-- Play / Pause -->
        <button class="ibtn" id="btn-play" title="播放 / 暫停 (Space / K)">
          <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <!-- -10s / +10s -->
        <!-- A quarter arc over the top with the seconds under it; +10 mirrors the arc -->
        <button class="ibtn" id="btn-back" title="-10 秒 (← / J)">
          <svg class="line" viewBox="0 0 24 24">
            <path d="M17.66 7.34A8 8 0 0 0 6.34 7.34"/>
            <path d="M6.34 3.84L6.34 7.34L9.84 7.34"/>
            <text x="12" y="19.5" text-anchor="middle" font-size="8.5" font-family="system-ui, sans-serif" font-weight="700">10</text>
          </svg>
        </button>
        <button class="ibtn" id="btn-fwd"  title="+10 秒 (→ / L)">
          <svg class="line" viewBox="0 0 24 24">
            <g transform="matrix(-1 0 0 1 24 0)">
              <path d="M17.66 7.34A8 8 0 0 0 6.34 7.34"/>
              <path d="M6.34 3.84L6.34 7.34L9.84 7.34"/>
            </g>
            <text x="12" y="19.5" text-anchor="middle" font-size="8.5" font-family="system-ui, sans-serif" font-weight="700">10</text>
          </svg>
        </button>

        <!-- Live indicator; goes back to live when behind -->
        <button class="ibtn" id="btn-live" title="直播中" style="display:none">
          <span class="ldot"></span>
          <span class="live-label">LIVE</span>
        </button>

        <!-- Time; for live, how far behind the edge -->
        <div id="time-disp">0:00</div>

        <div class="spacer"></div>

        <!-- Volume -->
        <div id="vol-wrap">
          <button class="ibtn" id="btn-mute" title="靜音 (M)">
            <svg id="ico-vol" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="ico-muted" viewBox="0 0 24 24" style="display:none">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" id="vol-slider" min="0" max="1" step="0.02" value="1" aria-label="音量">
        </div>

        <!-- Quality -->
        <div id="qual-wrap">
          <button class="ibtn" id="qual-btn" title="畫質" aria-label="畫質選單" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span id="qual-badge"></span>
          </button>
          <div id="qual-menu" role="menu" aria-label="畫質選單" aria-hidden="true"></div>
        </div>

        <!-- Picture-in-picture (hidden until supported and loaded) -->
        <button class="ibtn" id="btn-pip" title="子母畫面 (I)" style="display:none">
          <svg id="ico-pip-enter" viewBox="0 0 24 24">
            <path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/>
          </svg>
          <svg id="ico-pip-exit" viewBox="0 0 24 24" style="display:none">
            <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM6 8h7v5H6V8z"/>
          </svg>
        </button>

        <!-- Fullscreen -->
        <button class="ibtn" id="btn-fs" title="全螢幕 (F)">
          <svg id="ico-expand" viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
          <svg id="ico-shrink" viewBox="0 0 24 24" style="display:none">
            <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
          </svg>
        </button>

      </div><!-- /ctrl-row -->
    </div><!-- /bottom-bar -->
  </div><!-- /overlay -->
</div><!-- /wrap -->

<script type="module">
import { createPlayback, LIVE_BEHIND_THRESHOLD } from "/player-assets/player/playback.mjs";
const channelID   = location.pathname.split('/').filter(Boolean).pop();
// Used only if the gateway does not tell us which URL to play (see
// playbackSource); DASH is the historical default.
const fallbackManifestURL = `/v1/channels/${channelID}/manifest.mpd`;
const prLicURL    = `/v1/channels/${channelID}/license/playready`;
const wvLicURL    = `/v1/channels/${channelID}/license/widevine`;

// DOM
const wrap       = document.getElementById('wrap');
const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const spinner    = document.getElementById('spinner');
const errorBox   = document.getElementById('error-box');
const errorMsg   = document.getElementById('error-msg');
const unmuteHint = document.getElementById('unmute-hint');
const btnRetry   = document.getElementById('btn-retry');
const chanTitle  = document.getElementById('channel-title');
const startOverlay = document.getElementById('start-overlay');
const seekToast  = document.getElementById('seek-toast');
const progWrap   = document.getElementById('prog-wrap');
const progFill   = document.getElementById('prog-fill');
const progBuf    = document.getElementById('prog-buf');
const progThumb  = document.getElementById('prog-thumb');
const progTip    = document.getElementById('prog-tip');
const btnPlay    = document.getElementById('btn-play');
const icoPlay    = document.getElementById('ico-play');
const icoPause   = document.getElementById('ico-pause');
const btnBack    = document.getElementById('btn-back');
const btnFwd     = document.getElementById('btn-fwd');
const timeDisp   = document.getElementById('time-disp');
const btnLive    = document.getElementById('btn-live');
const btnMute    = document.getElementById('btn-mute');
const icoVol     = document.getElementById('ico-vol');
const icoMuted   = document.getElementById('ico-muted');
const volSlider  = document.getElementById('vol-slider');
const volWrap    = document.getElementById('vol-wrap');
const qualBtn    = document.getElementById('qual-btn');
const qualBadge  = document.getElementById('qual-badge');
const qualMenu   = document.getElementById('qual-menu');
const btnFs      = document.getElementById('btn-fs');
const btnPip     = document.getElementById('btn-pip');
const icoPipEnter = document.getElementById('ico-pip-enter');
const icoPipExit  = document.getElementById('ico-pip-exit');
const btnPipReturn = document.getElementById('btn-pip-return');
const icoExpand  = document.getElementById('ico-expand');
const icoShrink  = document.getElementById('ico-shrink');
const center     = document.getElementById('center');

let player         = null;
let isLive         = false;
let abrEnabled     = true;
let pinnedHeight   = null;  // null = ABR; persists across reconnects, and visits via saveQuality
let hideTimer      = null;
let toastTimer     = null;
let clickTimer     = null;
let dragging       = false;
let activePointerId  = null;
let progressHoverX = null;
let progressHovering = false;
let pipReady = false;           // true once a manifest has loaded

// Keep nearby buffered media when manually switching quality, but drop farther
// future buffer so the new quality takes effect without a full rebuffer.
const QUALITY_SWITCH_SAFE_MARGIN = 3;

// ── Channel info ──────────────────────────────────────────────────────────
let channelInfo = { drm: { playready: true, widevine: true } };
const channelInfoPromise = fetch(`/v1/channels/${channelID}/health`)
  .then(r => r.json())
  .then(d => {
    channelInfo = d;
    const t = d.title || channelID;
    chanTitle.textContent = t;
    document.title = `${t} — Sluice`;
    return d;
  })
  .catch(() => {
    chanTitle.textContent = channelID;
    document.title = `${channelID} — Sluice`;
    return channelInfo;
  });

// The health response selects the Source's output protocol and DRM endpoints.
async function playbackSource() {
  const info = await channelInfoPromise;
  const drm = info.drm || {};
  const drmServers = {};
  if (drm.widevine !== false) drmServers['com.widevine.alpha'] = wvLicURL;
  if (drm.playready !== false) drmServers['com.microsoft.playready'] = prLicURL;
  return { manifestURL: info.manifest_url || fallbackManifestURL, drmServers };
}

let playback = null;
let playbackState = { live: false, ready: false, phase: 'idle', busy: false };

// Playback owns media work; this is the one place that maps its events onto
// controls. Quality preferences stay on the page and are restored after load.
function renderPlaybackEvent(event) {
  switch (event.type) {
    case 'state': {
      const previous = playbackState;
      playbackState = event.state;
      isLive = playbackState.live;
      if (pipReady !== playbackState.ready) {
        pipReady = playbackState.ready;
        refreshPipButton();
      }
      if (previous.live !== isLive || previous.ready !== playbackState.ready) {
        btnLive.style.display = isLive ? '' : 'none';
        refreshMediaSessionActions();
      }
      spinner.classList.toggle('show', playbackState.busy);
      break;
    }
    case 'loaded':
      if (event.initial) restoreSavedQuality();
      restoreQualityPreference();
      buildQualityMenu();
      hideError();
      break;
    case 'recovering':
      hideError();
      setQualityMenuOpen(false);
      volWrap.classList.remove('popup');
      break;
    case 'progress':
      refreshProgress();
      refreshProgressTooltip();
      break;
    case 'play':
      refreshPlayIcon();
      break;
    case 'pause':
      spinner.classList.remove('show');
      refreshPlayIcon();
      showControls(true);
      break;
    case 'autoplay':
      if (event.started) {
        setStartOverlayVisible(false);
        if (event.muted) setUnmuteHintVisible(true);
      } else {
        if (event.blocked) {
          showControls(true);
          setStartOverlayVisible(true);
        }
        refreshPlayIcon();
      }
      break;
    case 'toast':
      showToast(event.message, event.duration);
      break;
    case 'error':
      showError(event.message);
      break;
  }
}

function hideError() {
  errorBox.classList.remove('show');
  errorMsg.textContent = '';
}

async function init() {
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    showError('此瀏覽器不支援 Shaka Player，請改用 Chrome 或 Edge。', false);
    return;
  }
  restoreVolume();
  refreshVolumeUI();
  player = new shaka.Player();
  playback = createPlayback({
    player, video, source: playbackSource, onEvent: renderPlaybackEvent,
    context: { dragging: () => dragging, hidden: videoHidden },
  });
  player.addEventListener('trackschanged', handleTracksChanged);
  player.addEventListener('adaptation', refreshQualityActive);
  player.addEventListener('variantchanged', refreshQualityActive);
  video.addEventListener('volumechange', refreshVolumeUI);
  document.addEventListener('visibilitychange', () => playback.visibilityChanged());
  video.addEventListener('enterpictureinpicture', handleEnterPip);
  video.addEventListener('leavepictureinpicture', handleLeavePip);
  registerAutoPip();
  await playback.start();
}

// ── Auto-hide controls + cursor ───────────────────────────────────────────
function showControls(lock) {
  overlay.classList.remove('hidden');
  wrap.style.cursor = '';
  clearTimeout(hideTimer);
  if (!lock && !video.paused) {
    hideTimer = setTimeout(hideControls, 3000);
  }
}

function hideControls() {
  // In PiP the page shows no video, so the controls have nothing to get out of the way of.
  if (video.paused || inPip()) return;
  // An open menu or a mouse resting on a bar means the viewer is using the controls.
  if (qualMenu.classList.contains('open') || volWrap.classList.contains('popup')) return;
  if (mouseOnBar) return;
  if (tabbedIntoControls && overlay.contains(document.activeElement)) return;
  overlay.classList.add('hidden');
  wrap.style.cursor = 'none';
}

// Tracked by pointer events rather than :hover, which sticks after a tap.
let mouseOnBar = false;
for (const bar of [document.getElementById('top-bar'), document.getElementById('bottom-bar')]) {
  bar.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') mouseOnBar = true; });
  bar.addEventListener('pointerleave', e => {
    if (e.pointerType !== 'mouse') return;
    mouseOnBar = false;
    showControls(false);
  });
}

// A tap on a touch screen while the controls are hidden only reveals them;
// set on pointerdown, before touchstart shows the controls.
let tapRevealsControls = false;
wrap.addEventListener('pointerdown', e => {
  tapRevealsControls = e.pointerType !== 'mouse' && overlay.classList.contains('hidden');
});

// Tabbing into hidden controls reveals them, and they stay while the keyboard
// is on them. Not :focus-visible: Chrome grants it to a clicked button as soon
// as any key is pressed, which would keep the controls up for good.
let tabbedIntoControls = false;
document.addEventListener('keydown', e => { if (e.key === 'Tab') tabbedIntoControls = true; }, true);
document.addEventListener('pointerdown', () => { tabbedIntoControls = false; }, true);
overlay.addEventListener('focusin', () => showControls(false));
overlay.addEventListener('focusout', () => showControls(false));

wrap.addEventListener('mousemove', () => showControls(false));
wrap.addEventListener('mouseleave', () => { if (!video.paused) hideControls(); });
wrap.addEventListener('touchstart', () => showControls(false), { passive: true });

// ── Play / Pause ──────────────────────────────────────────────────────────
async function togglePlay() {
  if (video.paused) {
    if (!playback) return;
    const result = await playback.play(true);
    if (result.ok) showCenterIcon('play');
  } else {
    video.pause();
    showCenterIcon('pause');
  }
}

function refreshPlayIcon() {
  icoPlay.style.display  = video.paused ? '' : 'none';
  icoPause.style.display = video.paused ? 'none' : '';
  if (!video.paused) setStartOverlayVisible(false);
}

btnPlay.addEventListener('click', togglePlay);

function isInteractiveTarget(target) {
  return !!(target && target.closest('#top-bar, #bottom-bar, #error-box, button, input, select, textarea, a'));
}

function handleSurfaceClick(e) {
  const target = e.target instanceof Element ? e.target : null;
  if (isInteractiveTarget(target)) return;
  if (qualMenu.classList.contains('open')) {
    setQualityMenuOpen(false);
    return;
  }
  if (volWrap.classList.contains('popup')) {
    volWrap.classList.remove('popup');
    return;
  }
  const revealOnly = tapRevealsControls;
  tapRevealsControls = false;
  if (clickTimer) {
    clearTimeout(clickTimer);
    clickTimer = null;
    // Double-click: seek based on which half
    seek(e.clientX < wrap.clientWidth / 2 ? -10 : 10);
  } else if (revealOnly) {
    // Still arm the timer so a double tap seeks.
    clickTimer = setTimeout(() => { clickTimer = null; }, 250);
  } else {
    clickTimer = setTimeout(() => {
      clickTimer = null;
      togglePlay();
      showControls(false);
    }, 250);
  }
}

wrap.addEventListener('click', handleSurfaceClick);

// ── Seek ──────────────────────────────────────────────────────────────────
function seek(delta) {
  if (!playback) return;
  try {
    playback.seek(video.currentTime + delta);
    showToast(delta < 0 ? `◀ ${Math.abs(delta)}s` : `${delta}s ▶`);
  } catch (err) {
    console.warn('[seek failed]', err);
    refreshProgress();
  }
}

function showToast(msg, duration = 800) {
  seekToast.classList.remove('icon');
  seekToast.textContent = msg;
  seekToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => seekToast.classList.remove('show'), duration);
}

const CENTER_ICONS = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>',
};

function showCenterIcon(kind, duration = 520) {
  const icon = CENTER_ICONS[kind];
  if (!icon) return;
  seekToast.classList.add('icon');
  seekToast.innerHTML = icon;
  seekToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => seekToast.classList.remove('show'), duration);
}

function setStartOverlayVisible(visible) {
  startOverlay.classList.toggle('show', visible);
  startOverlay.setAttribute('aria-hidden', String(!visible));
}

btnBack.addEventListener('click', () => seek(-10));
btnFwd.addEventListener('click',  () => seek(+10));

btnLive.addEventListener('click', () => {
  // At the live edge the button is only an indicator.
  if (!isLive || !player || !btnLive.classList.contains('behind')) return;
  try {
    const sr = player.seekRange();
    playback.seek(sr.end);
    showControls(false);
  } catch (_) {}
});

// ── Progress ──────────────────────────────────────────────────────────────
function refreshProgress() {
  if (dragging) return;
  let state;
  try {
    state = progressState();
  } catch (_) {
    return;
  }
  const { pos, total } = state;
  const pct = total > 0 ? Math.max(0, Math.min(1, pos / total)) : 0;
  progFill.style.width  = `${pct * 100}%`;
  progThumb.style.left  = `${pct * 100}%`;

  // Buffer
  const buf = video.buffered;
  let bufPct = 0;
  if (buf.length > 0 && total > 0) {
    try {
      const start = isLive && player ? player.seekRange().start : 0;
      bufPct = Math.max(0, Math.min(1, (buf.end(buf.length - 1) - start) / total));
    } catch (_) {
      bufPct = 0;
    }
  }
  progBuf.style.width = `${bufPct * 100}%`;
  refreshTimeDisplay(pos, total);
  progWrap.setAttribute('aria-valuenow', String(Math.round(pct * 100)));
  // At the live edge the time display is empty; the indicator says LIVE.
  progWrap.setAttribute('aria-valuetext', timeDisp.textContent || 'LIVE');
}

function progressPoint(clientX) {
  const rect = progWrap.getBoundingClientRect();
  if (rect.width <= 0) return null;
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return { pct, rect };
}

function progressLabelAt(pct) {
  if (isLive) {
    if (!player) return '';
    const sr = player.seekRange();
    const target = sr.start + pct * (sr.end - sr.start);
    const behind = Math.max(0, sr.end - target);
    return behind <= LIVE_BEHIND_THRESHOLD ? 'LIVE' : `-${fmt(Math.round(behind))}`;
  }
  const duration = Number.isFinite(video.duration) ? video.duration : 0;
  return fmt(pct * duration);
}

function updateProgressTooltip(clientX) {
  const point = progressPoint(clientX);
  if (!point) return;
  try {
    const label = progressLabelAt(point.pct);
    if (!label) return;
    progressHoverX = clientX;
    progTip.textContent = label;
    progTip.style.left = `${point.pct * 100}%`;
    progTip.classList.add('show');
  } catch (_) {}
}

function refreshProgressTooltip() {
  if (progressHoverX !== null) updateProgressTooltip(progressHoverX);
}

function hideProgressTooltip() {
  progressHoverX = null;
  progTip.classList.remove('show');
}

function progressState() {
  if (isLive) {
    if (!player) return { pos: 0, total: 0 };
    const sr = player.seekRange();
    const total = Math.max(0, sr.end - sr.start);
    const pos = Math.max(0, Math.min(total, video.currentTime - sr.start));
    return { pos, total };
  }
  return { pos: video.currentTime, total: video.duration || 0 };
}

function refreshTimeDisplay(pos, total) {
  if (isLive) {
    let behind;
    try {
      behind = Math.max(0, player.seekRange().end - video.currentTime);
    } catch (_) {
      return;
    }
    // The same threshold decides whether liveSync may pull playback back to
    // the edge, so "behind" on screen means liveSync has let go.
    const atEdge = behind <= LIVE_BEHIND_THRESHOLD;
    btnLive.classList.toggle('behind', !atEdge);
    btnLive.title = atEdge ? '直播中' : '回到直播';
    timeDisp.textContent = atEdge ? '' : `-${fmt(Math.round(behind))}`;
    return;
  }
  timeDisp.textContent = `${fmt(pos)} / ${fmt(total)}`;
}

function fmt(s) {
  if (!isFinite(s) || isNaN(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}

function seekFromPointer(clientX) {
  const point = progressPoint(clientX);
  if (!point) return;
  if (!playback) return;
  const { pct } = point;
  if (isLive) {
    if (!player) return;
    try {
      const sr = player.seekRange();
      playback.seek(sr.start + pct * (sr.end - sr.start));
    } catch (err) {
      console.warn('[progress seek failed]', err);
      return;
    }
  } else {
    const duration = Number.isFinite(video.duration) ? video.duration : 0;
    playback.seek(pct * duration);
  }
  progFill.style.width = `${pct * 100}%`;
  progThumb.style.left = `${pct * 100}%`;
  updateProgressTooltip(clientX);
}

// rAF-throttled seek during drag to avoid setting currentTime per mousemove
let pendingSeekX = null, rafSeekPending = false;
function scheduleSeek(x) {
  pendingSeekX = x;
  if (rafSeekPending) return;
  rafSeekPending = true;
  requestAnimationFrame(() => {
    rafSeekPending = false;
    if (pendingSeekX !== null) {
      seekFromPointer(pendingSeekX);
      pendingSeekX = null;
    }
  });
}

function beginProgressDrag(pointerId, clientX) {
  dragging = true;
  activePointerId = pointerId;
  progWrap.classList.add('dragging');
  updateProgressTooltip(clientX);
  if (typeof progWrap.setPointerCapture === 'function') {
    try { progWrap.setPointerCapture(pointerId); } catch (_) {}
  }
  seekFromPointer(clientX);
}

function endProgressDrag(pointerId, clientX = null) {
  if (!dragging) return;
  if (pointerId !== null && activePointerId !== null && pointerId !== activePointerId) return;
  // Commit the release position before releasing capture (which can dispatch
  // lostpointercapture) or discarding the pending animation frame.
  if (clientX !== null) seekFromPointer(clientX);
  pendingSeekX = null;
  if (activePointerId !== null && typeof progWrap.releasePointerCapture === 'function') {
    try { progWrap.releasePointerCapture(activePointerId); } catch (_) {}
  }
  if (!dragging) return;
  dragging = false;
  activePointerId = null;
  pendingSeekX = null;
  progWrap.classList.remove('dragging');
  if (!progressHovering) hideProgressTooltip();
  refreshProgress();
}

progWrap.addEventListener('pointerenter', e => {
  if (e.pointerType === 'touch') return;
  progressHovering = true;
  updateProgressTooltip(e.clientX);
});
progWrap.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  beginProgressDrag(e.pointerId, e.clientX);
});
progWrap.addEventListener('pointermove', e => {
  if (dragging && e.pointerId === activePointerId) {
    updateProgressTooltip(e.clientX);
    scheduleSeek(e.clientX);
    return;
  }
  if (progressHovering) updateProgressTooltip(e.clientX);
});
progWrap.addEventListener('pointerleave', () => {
  progressHovering = false;
  if (!dragging) hideProgressTooltip();
});
progWrap.addEventListener('pointerup', e => endProgressDrag(e.pointerId, e.clientX));
progWrap.addEventListener('pointercancel', e => endProgressDrag(e.pointerId));
progWrap.addEventListener('lostpointercapture', () => endProgressDrag(null));
window.addEventListener('pointerup', e => endProgressDrag(e.pointerId, e.clientX));

// ── Volume ────────────────────────────────────────────────────────────────
function refreshVolumeUI() {
  const muted = video.muted || video.volume === 0;
  icoVol.style.display   = muted ? 'none' : '';
  icoMuted.style.display = muted ? '' : 'none';
  if (!video.muted) volSlider.value = video.volume;
  if (!video.muted) setUnmuteHintVisible(false);
}

// The viewer's volume is remembered across visits. Only the viewer's own changes
// are saved: the muted autoplay fallback mutes without asking, and must not
// leave the next visit muted.
const VOLUME_KEY = 'sluice.player.volume';

function saveVolume() {
  try {
    localStorage.setItem(VOLUME_KEY, JSON.stringify({ volume: video.volume, muted: video.muted }));
  } catch (_) {}
}

function restoreVolume() {
  try {
    const saved = JSON.parse(localStorage.getItem(VOLUME_KEY));
    if (!saved) return;
    if (Number.isFinite(saved.volume)) video.volume = Math.max(0, Math.min(1, saved.volume));
    video.muted = saved.muted === true;
  } catch (_) {}
}

function setMuted(muted) {
  video.muted = muted;
  saveVolume();
}

// changeVolume is the keyboard's volume step; it shows where the volume landed.
function changeVolume(delta) {
  if (delta > 0) video.muted = false;
  video.volume = Math.max(0, Math.min(1, video.volume + delta));
  saveVolume();
  showToast(video.muted || video.volume === 0 ? '靜音' : `音量 ${Math.round(video.volume * 100)}%`);
}

btnMute.addEventListener('click', () => setMuted(!video.muted));
unmuteHint.addEventListener('click', () => setMuted(false));
volSlider.addEventListener('input', () => {
  video.volume = parseFloat(volSlider.value);
  video.muted  = video.volume === 0;
  saveVolume();
});

// Mobile: long-press mute button to reveal volume slider popup
let volPressTimer = null, volLongPressed = false;
btnMute.addEventListener('touchstart', () => {
  volLongPressed = false;
  volPressTimer = setTimeout(() => {
    volLongPressed = true;
    volWrap.classList.add('popup');
    showControls(true);
  }, 500);
}, { passive: true });
btnMute.addEventListener('touchend', e => {
  if (volPressTimer) { clearTimeout(volPressTimer); volPressTimer = null; }
  if (volLongPressed) e.preventDefault();
});
btnMute.addEventListener('touchcancel', () => {
  if (volPressTimer) { clearTimeout(volPressTimer); volPressTimer = null; }
});
document.addEventListener('click', e => {
  if (!volWrap.contains(e.target)) volWrap.classList.remove('popup');
});

function setUnmuteHintVisible(visible) {
  unmuteHint.hidden = !visible;
}

function listKey(value) {
  return Array.isArray(value) ? value.slice().sort().join(',') : (value || '');
}

function trackAudioKey(track) {
  if (!track) return '';
  return [
    track.language || '',
    track.label || '',
    listKey(track.audioRoles || track.roles),
    track.channelsCount || '',
  ].join('|');
}

function chooseHighestBandwidth(tracks) {
  return tracks.reduce((best, t) => {
    if (!best) return t;
    return (t.bandwidth || 0) > (best.bandwidth || 0) ? t : best;
  }, null);
}

function bestTrackForHeight(tracks, height, reference = null) {
  const candidates = tracks.filter(t => (t.height || 0) === height);
  if (!candidates.length) return null;

  const ref = reference || tracks.find(t => t.active) || null;
  const refAudio = trackAudioKey(ref);
  if (refAudio) {
    const sameAudio = candidates.filter(t => trackAudioKey(t) === refAudio);
    if (sameAudio.length) return chooseHighestBandwidth(sameAudio);
  }
  return chooseHighestBandwidth(candidates);
}

function qualityTracksByHeight(tracks) {
  const heights = [...new Set(tracks.map(t => t.height || 0).filter(h => h > 0))]
    .sort((a, b) => b - a);
  return heights
    .map(h => bestTrackForHeight(tracks, h))
    .filter(Boolean);
}

// Re-apply the user's quality preference after a fresh Shaka load or manifest
// track update. Keep the preference if the height temporarily disappears so a
// live Period change does not silently drop back to Auto.
function restoreQualityPreference() {
  if (!player) return;
  if (abrEnabled || pinnedHeight === null) {
    try {
      player.configure({ abr: { enabled: true } });
    } catch (err) {
      console.warn('[quality restore auto failed]', err);
    }
    return;
  }
  let tracks = [];
  try {
    tracks = player.getVariantTracks();
  } catch (err) {
    console.warn('[quality restore tracks failed]', err);
    return;
  }
  const target = bestTrackForHeight(tracks, pinnedHeight);
  try {
    player.configure({ abr: { enabled: false } });
  } catch (err) {
    console.warn('[quality restore fixed-mode failed]', err);
  }
  if (target) {
    try {
      player.selectVariantTrack(target, false);
    } catch (err) {
      console.warn('[quality restore select failed]', err);
    }
  }
  refreshQualityActive();
}

// A pinned quality is remembered per channel, since channels offer different
// heights. A saved height the channel no longer offers is dropped: pinning it
// would turn ABR off with no track to select.
const qualityKey = `sluice.player.quality.${channelID}`;

function saveQuality() {
  try {
    if (pinnedHeight === null) localStorage.removeItem(qualityKey);
    else localStorage.setItem(qualityKey, String(pinnedHeight));
  } catch (_) {}
}

function restoreSavedQuality() {
  let height;
  try {
    height = parseInt(localStorage.getItem(qualityKey), 10);
  } catch (_) {
    return;
  }
  if (!(height > 0)) return;
  let tracks = [];
  try {
    tracks = player.getVariantTracks();
  } catch (_) {
    return;
  }
  if (!tracks.some(t => t.height === height)) {
    saveQuality();
    return;
  }
  abrEnabled = false;
  pinnedHeight = height;
}

function handleTracksChanged() {
  restoreQualityPreference();
  buildQualityMenu();
}

// ── Quality selector ──────────────────────────────────────────────────────
function buildQualityMenu() {
  if (!player) return;
  let tracks = [];
  try {
    tracks = player.getVariantTracks();
  } catch (err) {
    console.warn('[quality menu tracks failed]', err);
    return;
  }

  // One visible option per height; internally prefer the variant that preserves
  // the currently selected audio language / role / channel layout.
  const sorted = qualityTracksByHeight(tracks);

  qualMenu.innerHTML = '';

  // Auto
  const autoEl = makeQI('Auto', null);
  autoEl.addEventListener('click', () => {
    abrEnabled = true;
    pinnedHeight = null;
    saveQuality();
    if (player && playbackState.phase !== 'recovering') {
      try {
        player.configure({ abr: { enabled: true } });
      } catch (err) {
        console.warn('[quality auto failed]', err);
      }
    }
    refreshQualityActive();
    setQualityMenuOpen(false, { restoreFocus: true });
  });
  qualMenu.appendChild(autoEl);

  for (const t of sorted) {
    const label = `${t.height}p`;
    const el = makeQI(label, t.id, t.height);
    el.addEventListener('click', () => {
      abrEnabled = false;
      pinnedHeight = t.height;
      saveQuality();
      if (player && playbackState.phase !== 'recovering') {
        try {
          const currentTracks = player.getVariantTracks();
          const target = bestTrackForHeight(currentTracks, t.height) || t;
          player.configure({ abr: { enabled: false } });
          player.selectVariantTrack(target, true, QUALITY_SWITCH_SAFE_MARGIN);
        } catch (err) {
          console.warn('[quality select failed]', err);
        }
      }
      refreshQualityActive();
      setQualityMenuOpen(false, { restoreFocus: true });
    });
    qualMenu.appendChild(el);
  }
  refreshQualityActive();
}

function makeQI(label, trackId, height = null) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'qi';
  el.setAttribute('role', 'menuitemradio');
  el.setAttribute('aria-checked', 'false');
  if (trackId !== null) el.dataset.tid = trackId;
  if (height !== null) el.dataset.height = String(height);
  el.innerHTML = `<span>${label}</span><span class="ck">✓</span>`;
  el.addEventListener('keydown', handleQualityMenuKeydown);
  return el;
}

function refreshQualityActive() {
  if (!player) return;
  let active = null;
  try {
    active = player.getVariantTracks().find(t => t.active);
  } catch (err) {
    console.warn('[quality active failed]', err);
    return;
  }
  // The button is a gear with the playing height as a badge; the words for it
  // live in its aria-label and on the menu's Auto item.
  const activeHeight = active && active.height ? active.height : null;
  const pinned = !abrEnabled && pinnedHeight !== null;
  const badgeHeight = pinned ? pinnedHeight : activeHeight;
  qualBadge.textContent = badgeHeight ? String(badgeHeight) : '';
  qualBtn.classList.toggle('pinned', pinned);
  qualBtn.setAttribute('aria-label', pinned
    ? `畫質選單，已指定 ${pinnedHeight}p`
    : activeHeight ? `畫質選單，自動，目前 ${activeHeight}p` : '畫質選單，自動');
  const autoLabel = qualMenu.querySelector('.qi span');
  if (autoLabel) autoLabel.textContent = activeHeight ? `Auto (${activeHeight}p)` : 'Auto';
  qualMenu.querySelectorAll('.qi').forEach((el, i) => {
    const selected = i === 0
      ? abrEnabled
      : (!abrEnabled && (
          (pinnedHeight !== null && String(pinnedHeight) === el.dataset.height) ||
          (pinnedHeight === null && active && String(active.id) === el.dataset.tid)
        ));
    el.classList.toggle('active', selected);
    el.setAttribute('aria-checked', selected ? 'true' : 'false');
    el.tabIndex = selected ? 0 : -1;
  });
}

function qualityItems() {
  return Array.from(qualMenu.querySelectorAll('.qi'));
}

function activeQualityItem() {
  return qualityItems().find(el => el.classList.contains('active')) || qualityItems()[0] || null;
}

function setQualityMenuOpen(open, opts = {}) {
  const { focusActive = false, restoreFocus = false } = opts;
  const wasOpen = qualMenu.classList.contains('open');
  qualMenu.classList.toggle('open', open);
  // hideControls skipped the controls while the menu was open; start the timer over.
  if (wasOpen && !open) showControls(false);
  qualBtn.setAttribute('aria-expanded', String(open));
  qualMenu.setAttribute('aria-hidden', String(!open));
  if (open && focusActive) {
    requestAnimationFrame(() => {
      const target = activeQualityItem();
      if (target) target.focus();
    });
  } else if (!open && restoreFocus) {
    qualBtn.focus();
  }
}

function moveQualityFocus(delta) {
  const items = qualityItems();
  if (!items.length) return;
  const current = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  const index = Math.max(0, items.indexOf(current));
  items[(index + delta + items.length) % items.length].focus();
}

function handleQualityMenuKeydown(e) {
  switch (e.key) {
    case 'ArrowDown':
      e.preventDefault();
      moveQualityFocus(1);
      break;
    case 'ArrowUp':
      e.preventDefault();
      moveQualityFocus(-1);
      break;
    case 'Home':
      e.preventDefault();
      qualityItems()[0]?.focus();
      break;
    case 'End': {
      e.preventDefault();
      const items = qualityItems();
      items[items.length - 1]?.focus();
      break;
    }
    case 'Escape':
      e.preventDefault();
      setQualityMenuOpen(false, { restoreFocus: true });
      break;
    case 'Tab':
      setQualityMenuOpen(false);
      break;
  }
}

qualBtn.addEventListener('click', e => {
  e.stopPropagation();
  setQualityMenuOpen(!qualMenu.classList.contains('open'), { focusActive: true });
});
qualBtn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    setQualityMenuOpen(true, { focusActive: true });
  } else if (e.key === 'Escape') {
    setQualityMenuOpen(false);
  }
});
document.addEventListener('click', () => setQualityMenuOpen(false));
qualMenu.addEventListener('click', e => e.stopPropagation());

// ── Fullscreen ────────────────────────────────────────────────────────────
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function toggleFullscreen() {
  if (fullscreenElement()) {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  } else {
    // A fullscreen page with the video still in the PiP window would be empty.
    // Not awaited: requestFullscreen must run while the click still counts
    // as a user gesture.
    if (inPip()) document.exitPictureInPicture().catch(() => {});
    enterFullscreen();
  }
}

function enterFullscreen() {
  if (wrap.requestFullscreen) {
    wrap.requestFullscreen().catch(() => {});
  } else if (wrap.webkitRequestFullscreen) {
    wrap.webkitRequestFullscreen();
  } else if (video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }
}

function refreshFullscreenIcon() {
  const fs = !!fullscreenElement();
  icoExpand.style.display = fs ? 'none' : '';
  icoShrink.style.display = fs ? '' : 'none';
}

document.addEventListener('fullscreenchange', refreshFullscreenIcon);
document.addEventListener('webkitfullscreenchange', refreshFullscreenIcon);
video.addEventListener('webkitbeginfullscreen', refreshFullscreenIcon);
video.addEventListener('webkitendfullscreen', refreshFullscreenIcon);

btnFs.addEventListener('click', toggleFullscreen);

// ── Picture-in-picture ────────────────────────────────────────────────────
const pipSupported = !!(document.pictureInPictureEnabled &&
  video.requestPictureInPicture && !video.disablePictureInPicture);

function inPip() {
  return !!document.pictureInPictureElement && document.pictureInPictureElement === video;
}

// videoHidden reports whether nobody can see the video: a hidden tab hides it
// unless it is playing in the PiP window.
function videoHidden() {
  return document.hidden && !inPip();
}

function pipAvailable() {
  return pipSupported && pipReady;
}

function refreshPipButton() {
  btnPip.style.display = pipAvailable() ? '' : 'none';
  const active = inPip();
  icoPipEnter.style.display = active ? 'none' : '';
  icoPipExit.style.display  = active ? '' : 'none';
  btnPip.title = active ? '結束子母畫面 (I)' : '子母畫面 (I)';
}

async function togglePip() {
  if (!pipAvailable()) return;
  try {
    if (inPip()) {
      await document.exitPictureInPicture();
    } else {
      await video.requestPictureInPicture();
    }
  } catch (err) {
    console.warn('[pip failed]', err);
  }
}

function handleEnterPip() {
  wrap.classList.add('pip');
  refreshPipButton();
  showControls(true);
}

// Chrome's "back to tab" keeps playing and its ✕ pauses; both are left as is.
function handleLeavePip() {
  wrap.classList.remove('pip');
  refreshPipButton();
  showControls(false);
  if (document.hidden && playback) playback.visibilityChanged();
}

// Media Session actions show up as buttons in the PiP window. Seeking only
// makes sense for VOD; a live channel keeps just play and pause.
function setMediaSessionAction(action, handler) {
  try {
    navigator.mediaSession.setActionHandler(action, handler);
  } catch (_) {
    // The browser does not know this action.
  }
}

function refreshMediaSessionActions() {
  if (!('mediaSession' in navigator)) return;
  setMediaSessionAction('seekbackward', isLive ? null : () => seek(-10));
  setMediaSessionAction('seekforward',  isLive ? null : () => seek(+10));
}

// Lets Chrome move a playing video into PiP when the viewer switches tabs;
// whether it does is the browser's call.
function registerAutoPip() {
  if (!pipSupported || !('mediaSession' in navigator)) return;
  setMediaSessionAction('enterpictureinpicture', () => {
    if (pipReady && !inPip()) {
      video.requestPictureInPicture().catch(err => console.warn('[auto pip failed]', err));
    }
  });
}

btnPip.addEventListener('click', togglePip);
btnPipReturn.addEventListener('click', () => {
  if (inPip()) document.exitPictureInPicture().catch(() => {});
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // The quality menu handles its own arrow keys and prevents their default.
  if (e.defaultPrevented) return;
  const target = e.target instanceof HTMLElement ? e.target : null;
  if (target && (['INPUT','TEXTAREA','SELECT'].includes(target.tagName) || target.isContentEditable)) return;
  // A focused button keeps Space and Enter; every other shortcut still works
  // after a control is clicked.
  if (target && target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  switch (e.key) {
    case ' ': case 'k': case 'K':
      e.preventDefault(); togglePlay(); showControls(false); break;
    case 'ArrowLeft': case 'j': case 'J':
      e.preventDefault(); seek(-10); showControls(false); break;
    case 'ArrowRight': case 'l': case 'L':
      e.preventDefault(); seek(+10); showControls(false); break;
    case 'ArrowUp':
      e.preventDefault(); changeVolume(+0.05); showControls(false); break;
    case 'ArrowDown':
      e.preventDefault(); changeVolume(-0.05); showControls(false); break;
    case 'm': case 'M':
      setMuted(!video.muted); showControls(false); break;
    case 'f': case 'F':
      toggleFullscreen(); break;
    case 'i': case 'I':
      togglePip(); break;
    case 'Escape':
      setQualityMenuOpen(false); break;
    default:
      if (!isLive && e.key >= '0' && e.key <= '9') {
        if (playback) playback.seek((video.duration || 0) * (parseInt(e.key) / 10));
        showControls(false);
      }
  }
});

// ── Error ─────────────────────────────────────────────────────────────────
// retry offers a button that reloads the page; an unsupported browser gets none.
function showError(msg, retry = true) {
  errorMsg.textContent = msg;
  btnRetry.hidden = !retry;
  errorBox.classList.add('show');
  setStartOverlayVisible(false);
}

// A reload starts over from init: every error shown here either stopped init
// or came after recovery gave up, so there is no player state worth keeping.
btnRetry.addEventListener('click', () => location.reload());

document.addEventListener('DOMContentLoaded', init);

// ── Cleanup on page unload (mobile-Safari friendly) ──────────────────────
window.addEventListener('pagehide', () => {
  if (playback) playback.dispose();
});

// pagehide also fires when the page enters the back/forward cache, so a page
// restored from it has a destroyed player: load it again.
window.addEventListener('pageshow', e => {
  if (e.persisted) location.reload();
});
</script>
</body>
